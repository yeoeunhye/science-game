<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>원소카드</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <script src="js/app/theme.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/board.css">
</head>
<body>
  <button class="theme-btn" id="theme-btn" data-action="theme" aria-label="라이트 모드로 전환" title="다크 / 라이트 모드">
    <svg class="ico-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="ico-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
  <button class="theme-btn snd-btn" id="snd-btn" aria-label="소리 끄기" title="소리 끄기">
    <svg class="ico-on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
    <svg class="ico-off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
  </button>
  <div id="bg" aria-hidden="true">
    <div class="deco-floor"><i></i><i></i><i></i></div>
    <div class="deco-cloud c-l"></div><div class="deco-cloud c-r"></div>
    <svg class="spark s1" viewBox="0 0 24 24"><path d="M12 0c1 7 5 11 12 12-7 1-11 5-12 12-1-7-5-11-12-12 7-1 11-5 12-12z"/></svg>
    <svg class="spark s2" viewBox="0 0 24 24"><path d="M12 0c1 7 5 11 12 12-7 1-11 5-12 12-1-7-5-11-12-12 7-1 11-5 12-12z"/></svg>
    <svg class="spark s3" viewBox="0 0 24 24"><path d="M12 0c1 7 5 11 12 12-7 1-11 5-12 12-1-7-5-11-12-12 7-1 11-5 12-12z"/></svg>
    <svg class="spark s4" viewBox="0 0 24 24"><path d="M12 0c1 7 5 11 12 12-7 1-11 5-12 12-1-7-5-11-12-12 7-1 11-5 12-12z"/></svg>
    <svg class="atom" viewBox="-50 -50 100 100"><g fill="none" stroke="currentColor" stroke-width="3.2"><ellipse rx="44" ry="16"/><ellipse rx="44" ry="16" transform="rotate(60)"/><ellipse rx="44" ry="16" transform="rotate(120)"/></g><circle r="7" fill="currentColor"/></svg>
  </div>

  <main id="screen-main" class="screen">
    <button class="profile-chip" id="profile-chip" data-action="profile"></button>
    <div class="logo" aria-label="원소카드">
      <span class="orbit o1"><i></i><i></i><i></i></span>
      <svg class="flask" viewBox="0 0 64 80"><path d="M24 4h16v6h-3v16l18 34c3 6-1 14-8 14H17c-7 0-11-8-8-14l18-34V10h-3z" fill="#eaf3ff"/><path d="M14 52h36l8 14c2 5-1 10-7 10H13c-6 0-9-5-7-10z" fill="#3b8cff"/><circle cx="26" cy="62" r="3" fill="#bfe0ff"/><circle cx="38" cy="58" r="2" fill="#bfe0ff"/></svg>
      <div class="logo-badge">
        <span class="logo-small">ELEMENT CARD</span>
        <span class="logo-big">원소카드</span>
      </div>
    </div>

    <nav class="menu">
      <button class="mbtn primary" data-action="solo"><svg class="mi" viewBox="0 0 24 24"><path d="M7 8h10a5 5 0 0 1 4.9 6l-.6 3a2.6 2.6 0 0 1-4.6 1.1L15.5 16h-7l-1.2 2.100A2.600 2.600 0 0 1 2.700 17l-.6-3A5 5 0 0 1 7 8z"/><path d="M8 10.500v3M6.500 12h3"/><circle cx="15.500" cy="11.500" r=".9"/><circle cx="17.800" cy="13" r=".9"/></svg><span><b>혼자하기</b><small>AI와 대결 · 2~4명</small></span><i>→</i></button>
      <button class="mbtn" data-action="friends"><svg class="mi" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.200"/><path d="M3 20c0-3.500 2.700-6 6-6s6 2.500 6 6"/><circle cx="17" cy="9" r="2.500"/><path d="M16.500 14c3 0 5 2 5 5"/></svg><span><b>친구와 하기</b><small>초대 코드로 함께 · 최대 4명</small></span><i>→</i></button>
      <button class="mbtn" data-action="tutorial"><svg class="mi" viewBox="0 0 24 24"><path d="M12 6c-2-1.500-5-2-9-2v14c4 0 7 .5 9 2 2-1.500 5-2 9-2V4c-4 0-7 .5-9 2z"/><path d="M12 6v14"/></svg><span><b>게임방법보기</b><small>규칙과 특수카드 설명</small></span><i>→</i></button>
    </nav>

    <button class="link-btn" data-action="table">주기율표 보기</button>
    <p class="tagline">같은 <b>주기</b>, 같은 <b>족</b> — 먼저 손패를 비워라!</p>
  </main>

  <!-- 게임 보드 -->
  <section id="screen-game" class="screen game"></section>

  <!-- 프로필 -->
  <div id="profile" class="overlay hidden" role="dialog" aria-modal="true" aria-label="내 프로필">
    <div class="panel setup">
      <header class="tut-head">
        <h2>내 프로필</h2>
        <button class="x" data-action="profile-close" aria-label="닫기">✕</button>
      </header>
      <div class="tut-body">
        <div class="field"><div class="big-av" id="pf-av"></div><input id="pf-name" maxlength="8" placeholder="닉네임 (최대 8글자)" autocomplete="off"></div>
        <div><h4>이모티콘</h4><div class="emoji-grid" id="pf-grid"></div></div>
        <button class="btn btn-yellow" data-action="profile-save">저장</button>
      </div>
    </div>
  </div>

  <!-- 혼자하기 설정 -->
  <div id="setup" class="overlay hidden" role="dialog" aria-modal="true" aria-label="게임 설정">
    <div class="panel setup">
      <header class="tut-head">
        <h2>혼자하기</h2>
        <button class="x" data-action="setup-close" aria-label="닫기">✕</button>
      </header>
      <div class="tut-body">
        <div><h4>인원</h4><div class="seg" id="seg-players"></div></div>
        <div><h4>카드 구성</h4><div class="seg" id="seg-mode"></div></div>
        <button class="btn btn-yellow" data-action="setup-start">시작</button>
      </div>
    </div>
  </div>

  <!-- 친구와 하기 (서버 연결 / 방 만들기 / 대기실) -->
  <div id="friends" class="overlay hidden" role="dialog" aria-modal="true" aria-label="친구와 하기">
    <div class="panel setup">
      <header class="tut-head">
        <h2 id="fr-title">친구와 하기</h2>
        <button class="x" data-action="friends-close" aria-label="닫기">✕</button>
      </header>
      <div class="tut-body" id="fr-body"></div>
    </div>
  </div>
  <div id="netbar" class="netbar hidden" role="status"></div>

  <!-- 게임방법보기 -->
  <div id="tutorial" class="overlay hidden" role="dialog" aria-modal="true" aria-label="게임 방법">
    <div class="panel tut">
      <header class="tut-head">
        <h2 id="tut-title"></h2>
        <button class="x" data-action="tut-close" aria-label="닫기">✕</button>
      </header>
      <div id="tut-body" class="tut-body"></div>
      <footer class="tut-foot">
        <button class="btn btn-sm btn-ghost" id="tut-prev">◀ 이전</button>
        <div id="tut-dots" class="dots"></div>
        <button class="btn btn-sm btn-yellow" id="tut-next">다음 ▶</button>
      </footer>
    </div>
  </div>

  <!-- 주기율표 팝업 -->
  <div id="tablemodal" class="overlay hidden" role="dialog" aria-modal="true" aria-label="주기율표">
    <div class="panel tbl">
      <header class="tut-head">
        <h2>주기율표 (1~36번)</h2>
        <button class="x" data-action="table-close" aria-label="닫기">✕</button>
      </header>
      <div id="tablemodal-body" class="tut-body"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="shared/elements.js"></script>
  <script src="shared/rules.js"></script>
  <script src="shared/ai.js"></script>
  <script src="js/game/fx.js"></script>
  <script src="js/app/profile.js"></script>
  <script src="js/game/cards.js"></script>
  <script src="js/game/tutorial.js"></script>
  <script src="js/game/board.js"></script>
  <script src="js/game/solo.js"></script>
  <script src="js/online/net.js"></script>
  <script src="js/online/mp.js"></script>
  <script src="js/app/main.js"></script>
</body>
</html>
